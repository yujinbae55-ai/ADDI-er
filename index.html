<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADDI+er 출퇴근 관리</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --brand: #8B3FFF; --brand-light: #F0E8FF; --brand-mid: #C9A0FF; --brand-dark: #5C1FCC;
    --bg: #FAFAFA; --surface: #FFFFFF; --border: rgba(0,0,0,0.08);
    --text: #1A1A1A; --text-muted: #7A7A8A; --text-hint: #ADADBD;
    --success: #10B981; --success-light: #D1FAE5;
    --warning: #F59E0B; --warning-light: #FEF3C7;
    --danger: #EF4444; --danger-light: #FEE2E2;
    --radius: 14px; --radius-sm: 8px;
    --shadow: 0 2px 16px rgba(139,63,255,0.08);
  }
  body { font-family: -apple-system, 'Malgun Gothic', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 15px; line-height: 1.6; }
  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

  .topbar { position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
  .topbar-logo { font-size: 18px; font-weight: 700; color: var(--brand); letter-spacing: -0.5px; }
  .topbar-logo span { color: var(--text); }
  .topbar-right { display: flex; align-items: center; gap: 8px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--brand-light); color: var(--brand); font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid var(--brand-mid); transition: all 0.2s; }
  .avatar:hover { background: var(--brand); color: white; }
  .admin-badge { font-size: 11px; font-weight: 600; padding: 3px 8px; background: var(--brand-light); color: var(--brand); border-radius: 20px; border: 1px solid var(--brand-mid); }

  .page { flex: 1; padding: 20px; display: none; flex-direction: column; gap: 16px; padding-bottom: 80px; }
  .page.active { display: flex; }

  .login-wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; }
  .login-hero { text-align: center; margin-bottom: 32px; }
  .login-logo { font-size: 36px; font-weight: 800; color: var(--brand); letter-spacing: -1px; margin-bottom: 6px; }
  .login-logo span { color: var(--text); }
  .login-subtitle { font-size: 14px; color: var(--text-muted); }
  .login-card { width: 100%; max-width: 360px; background: var(--surface); border-radius: 20px; padding: 28px 24px; border: 1px solid var(--border); box-shadow: var(--shadow); }
  .login-card h2 { font-size: 17px; font-weight: 600; margin-bottom: 20px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .field input { padding: 12px 14px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); font-size: 15px; font-family: inherit; outline: none; transition: border-color 0.2s; background: var(--bg); }
  .field input:focus { border-color: var(--brand); background: white; }
  .field input::placeholder { color: var(--text-hint); }
  .btn { width: 100%; padding: 13px; border-radius: var(--radius-sm); border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit; }
  .btn-primary { background: var(--brand); color: white; }
  .btn-primary:hover { background: var(--brand-dark); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(139,63,255,0.3); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { background: var(--text-hint); cursor: not-allowed; transform: none; box-shadow: none; }
  .error-msg { font-size: 13px; color: var(--danger); background: var(--danger-light); padding: 10px 12px; border-radius: var(--radius-sm); margin-bottom: 12px; }
  .register-hint { text-align: center; margin-top: 14px; font-size: 13px; color: var(--text-muted); }
  .link-btn { background: none; border: none; color: var(--brand); font-weight: 600; cursor: pointer; font-size: 13px; font-family: inherit; }

  .greeting { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .greeting span { color: var(--brand); }
  .date-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-muted); background: var(--surface); border: 1px solid var(--border); padding: 5px 12px; border-radius: 20px; align-self: flex-start; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }
  .status-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 20px; box-shadow: var(--shadow); }
  .status-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .status-label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .status-badge { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }
  .badge-in { background: var(--success-light); color: #059669; }
  .badge-out { background: var(--warning-light); color: #D97706; }
  .badge-none { background: #F3F4F6; color: #6B7280; }
  .time-display { display: flex; gap: 20px; margin-bottom: 16px; }
  .time-item { display: flex; flex-direction: column; gap: 2px; }
  .time-item .tl { font-size: 11px; color: var(--text-hint); font-weight: 500; }
  .time-item .tv { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
  .time-item .tv.muted { color: var(--text-hint); font-size: 16px; }
  .action-row { display: flex; gap: 10px; }
  .btn-action { flex: 1; padding: 13px 10px; border-radius: var(--radius-sm); border: none; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .btn-checkin { background: var(--brand); color: white; }
  .btn-checkin:hover { background: var(--brand-dark); box-shadow: 0 4px 16px rgba(139,63,255,0.3); }
  .btn-checkout { background: #1A1A1A; color: white; }
  .btn-checkout:hover { background: #333; }
  .btn-action:disabled { opacity: 0.35; cursor: not-allowed; }
  .section-title { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .record-list { display: flex; flex-direction: column; gap: 8px; }
  .record-item { background: var(--surface); border-radius: var(--radius-sm); border: 1px solid var(--border); padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; }
  .record-date { font-size: 14px; font-weight: 600; }
  .record-times { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .record-duration { font-size: 13px; font-weight: 700; color: var(--brand); background: var(--brand-light); padding: 4px 9px; border-radius: 20px; white-space: nowrap; }
  .empty-state { text-align: center; padding: 28px; color: var(--text-hint); font-size: 14px; border: 1.5px dashed var(--border); border-radius: var(--radius); background: var(--surface); }

  .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: rgba(255,255,255,0.97); backdrop-filter: blur(12px); border-top: 1px solid var(--border); display: flex; padding: 8px 0 12px; z-index: 100; }
  .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; cursor: pointer; padding: 6px; font-family: inherit; transition: all 0.15s; }
  .nav-icon { font-size: 20px; }
  .nav-label { font-size: 10px; font-weight: 600; color: var(--text-hint); }
  .nav-btn.active .nav-label { color: var(--brand); }

  .tabs { display: flex; background: var(--brand-light); border-radius: var(--radius-sm); padding: 3px; gap: 2px; }
  .tab-btn { flex: 1; padding: 8px; border-radius: 6px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; background: transparent; color: var(--brand); transition: all 0.15s; }
  .tab-btn.active { background: var(--brand); color: white; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-card { background: var(--surface); border-radius: var(--radius-sm); border: 1px solid var(--border); padding: 16px; }
  .stat-card .sv { font-size: 28px; font-weight: 800; color: var(--brand); letter-spacing: -1px; }
  .stat-card .sl { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
  .member-row { background: var(--surface); border-radius: var(--radius-sm); border: 1px solid var(--border); padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  .member-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--brand-light); color: var(--brand); font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .member-info { flex: 1; min-width: 0; }
  .member-name { font-size: 15px; font-weight: 600; }
  .member-time { font-size: 12px; color: var(--text-muted); }
  .member-status { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px; white-space: nowrap; }
  .month-selector { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: var(--radius-sm); border: 1px solid var(--border); padding: 10px 14px; }
  .month-selector select { border: none; background: none; font-family: inherit; font-size: 14px; font-weight: 600; color: var(--text); cursor: pointer; outline: none; flex: 1; }

  .admin-toggle-row { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .admin-toggle-label { font-size: 12px; color: var(--text-muted); flex: 1; }
  .toggle { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
  .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
  .toggle-slider { position: absolute; inset: 0; background: #DDD; border-radius: 11px; cursor: pointer; transition: 0.2s; }
  .toggle-slider:before { content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: white; border-radius: 50%; transition: 0.2s; }
  .toggle input:checked + .toggle-slider { background: var(--brand); }
  .toggle input:checked + .toggle-slider:before { transform: translateX(18px); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: flex-end; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal { background: white; border-radius: 20px 20px 0 0; width: 100%; max-height: 80vh; overflow-y: auto; padding: 20px; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1); }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-handle { width: 40px; height: 4px; border-radius: 2px; background: var(--border); margin: 0 auto 16px; }

  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1A1A1A; color: white; font-size: 13px; font-weight: 500; padding: 10px 18px; border-radius: 20px; z-index: 300; opacity: 0; transition: all 0.25s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">
  <!-- LOGIN -->
  <div id="login-page" class="login-wrap">
    <div class="login-hero">
      <div class="login-logo">ADDI<span>+er</span></div>
      <div class="login-subtitle">팀 출퇴근 관리 시스템</div>
    </div>
    <div class="login-card">
      <h2 id="login-title">로그인</h2>
      <div class="field">
        <label>이름</label>
        <input type="text" id="login-name" placeholder="홍길동" />
      </div>
      <div class="field">
        <label>전화번호 뒷 4자리</label>
        <input type="text" id="login-phone" placeholder="1234" maxlength="4" inputmode="numeric" />
      </div>
      <div id="login-error" class="error-msg" style="display:none;"></div>
      <button class="btn btn-primary" id="login-btn" onclick="handleLogin()">로그인</button>
      <div class="register-hint">처음이신가요? <button class="link-btn" onclick="toggleRegister()">회원가입</button></div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="main-app" style="display:none;" class="app">
    <div class="topbar">
      <div class="topbar-logo">ADDI<span>+er</span></div>
      <div class="topbar-right">
        <span class="admin-badge" id="admin-badge" style="display:none;">관리자</span>
        <div class="avatar" id="user-avatar" onclick="logout()">?</div>
      </div>
    </div>

    <!-- HOME -->
    <div class="page active" id="page-home">
      <div class="greeting">안녕하세요, <span id="user-name-display">유진</span>님 👋</div>
      <div class="date-chip"><div class="dot"></div><span id="today-date"></span></div>
      <div class="status-card">
        <div class="status-row">
          <div class="status-label">오늘 출퇴근</div>
          <div class="status-badge badge-none" id="status-badge">미출근</div>
        </div>
        <div class="time-display">
          <div class="time-item"><div class="tl">출근</div><div class="tv muted" id="checkin-display">--:--</div></div>
          <div class="time-item"><div class="tl">퇴근</div><div class="tv muted" id="checkout-display">--:--</div></div>
          <div class="time-item" id="duration-item" style="display:none;"><div class="tl">근무시간</div><div class="tv" id="duration-display" style="color:var(--brand);"></div></div>
        </div>
        <div class="action-row">
          <button class="btn-action btn-checkin" id="checkin-btn" onclick="handleCheckIn()">출근하기</button>
          <button class="btn-action btn-checkout" id="checkout-btn" onclick="handleCheckOut()" disabled>퇴근하기</button>
        </div>
      </div>
      <div class="section-title">최근 기록</div>
      <div class="record-list" id="record-list"><div class="empty-state">불러오는 중...</div></div>
    </div>

    <!-- ADMIN -->
    <div class="page" id="page-admin">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchAdminTab('today')">오늘 현황</button>
        <button class="tab-btn" onclick="switchAdminTab('monthly')">월간 조회</button>
        <button class="tab-btn" onclick="switchAdminTab('members')">팀원 관리</button>
      </div>
      <div id="admin-today">
        <div class="stat-grid" style="margin-bottom:16px;">
          <div class="stat-card"><div class="sv" id="stat-in">-</div><div class="sl">출근 완료</div></div>
          <div class="stat-card"><div class="sv" id="stat-total">-</div><div class="sl">전체 팀원</div></div>
        </div>
        <div class="section-title" style="margin-bottom:8px;">팀원 현황</div>
        <div id="member-list" class="record-list"><div class="empty-state">불러오는 중...</div></div>
      </div>
      <div id="admin-monthly" style="display:none;">
        <div class="month-selector"><span>📅</span><select id="month-select" onchange="loadMonthlyData()"></select></div>
        <div id="monthly-list" class="record-list" style="margin-top:12px;"><div class="empty-state">월을 선택하세요</div></div>
      </div>
      <div id="admin-members" style="display:none;">
        <div class="section-title" style="margin-bottom:8px;">관리자 권한 관리</div>
        <div style="font-size:13px;color:var(--text-muted);margin-bottom:12px;">토글을 켜면 해당 팀원에게 관리자 권한이 부여됩니다.</div>
        <div id="admin-member-list" class="record-list"><div class="empty-state">불러오는 중...</div></div>
      </div>
    </div>

    <div class="bottom-nav">
      <button class="nav-btn active" id="nav-home" onclick="switchPage('home')">
        <span class="nav-icon">🏠</span><span class="nav-label">홈</span>
      </button>
      <button class="nav-btn" id="nav-admin" onclick="switchPage('admin')" style="display:none;">
        <span class="nav-icon">📊</span><span class="nav-label">관리자</span>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal"><div class="modal-handle"></div><div id="modal-content"></div></div>
</div>

<script>
const PROJECT_ID = "gen-lang-client-0248977560";
const DB_ID = "ai-studio-ccb3fe3c-d3e5-442a-b297-dd1fed17c910";
const BASE = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/${DB_ID}/documents`;
const SEED_ADMIN = { name: "배유진", phoneLast4: "1734" };

async function fsQuery(col, filters = []) {
  const url = `${BASE}:runQuery`;
  const where = filters.length === 0 ? undefined :
    filters.length === 1 ? { fieldFilter: { field: { fieldPath: filters[0][0] }, op: filters[0][1], value: fsVal(filters[0][2]) } } :
    { compositeFilter: { op: "AND", filters: filters.map(f => ({ fieldFilter: { field: { fieldPath: f[0] }, op: f[1], value: fsVal(f[2]) } })) } };
  const body = { structuredQuery: { from: [{ collectionId: col }], where, limit: 50 } };
  if (!where) delete body.structuredQuery.where;
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) return [];
  const rows = await r.json();
  return rows.filter(d => d.document).map(d => ({ id: d.document.name.split('/').pop(), ...fsParseDoc(d.document) }));
}

async function fsSet(col, docId, data) {
  const r = await fetch(`${BASE}/${col}/${docId}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fields: fsEncode(data) }) });
  return r.ok ? r.json() : null;
}

async function fsAdd(col, data) {
  const r = await fetch(`${BASE}/${col}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fields: fsEncode(data) }) });
  if (!r.ok) return null;
  const d = await r.json();
  return d.name.split('/').pop();
}

async function fsUpdate(col, docId, data) {
  const mask = Object.keys(data).map(k => `updateMask.fieldPaths=${k}`).join('&');
  const r = await fetch(`${BASE}/${col}/${docId}?${mask}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fields: fsEncode(data) }) });
  return r.ok;
}

function fsVal(v) {
  if (typeof v === 'boolean') return { booleanValue: v };
  if (typeof v === 'number') return { integerValue: String(v) };
  return { stringValue: String(v) };
}
function fsEncode(obj) {
  const out = {};
  for (const [k, v] of Object.entries(obj)) {
    if (v == null) continue;
    if (typeof v === 'boolean') out[k] = { booleanValue: v };
    else if (typeof v === 'number') out[k] = { integerValue: String(v) };
    else out[k] = { stringValue: String(v) };
  }
  return out;
}
function fsParseDoc(doc) {
  const out = {};
  for (const [k, v] of Object.entries(doc.fields || {})) {
    out[k] = v.booleanValue ?? v.stringValue ?? v.integerValue ?? v.timestampValue ?? null;
  }
  return out;
}

let currentUser = null;
let todayAttendance = null;
let isRegisterMode = false;

function getToday() { return new Date().toISOString().slice(0, 10); }
function formatTime(iso) { if (!iso) return '--:--'; return new Date(iso).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false }); }
function formatDate(iso) { return new Date(iso).toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' }); }
function calcDuration(ci, co) {
  if (!ci || !co) return null;
  const m = (new Date(co) - new Date(ci)) / 60000;
  return `${Math.floor(m/60)}h ${Math.floor(m%60)}m`;
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
function isAdmin(u) { return u && (u.isAdmin === true || u.isAdmin === 'true'); }

async function ensureAdminSeed() {
  const existing = await fsQuery('users', [['name', 'EQUAL', SEED_ADMIN.name], ['phoneLast4', 'EQUAL', SEED_ADMIN.phoneLast4]]);
  if (existing.length > 0) {
    if (!isAdmin(existing[0])) {
      await fsUpdate('users', existing[0].id, { isAdmin: true });
      existing[0].isAdmin = true;
    }
    return existing[0];
  }
  await fsSet('users', 'baeyujin_1734', { name: SEED_ADMIN.name, phoneLast4: SEED_ADMIN.phoneLast4, createdAt: new Date().toISOString(), isAdmin: true });
  return { id: 'baeyujin_1734', name: SEED_ADMIN.name, phoneLast4: SEED_ADMIN.phoneLast4, isAdmin: true };
}

function toggleRegister() {
  isRegisterMode = !isRegisterMode;
  document.getElementById('login-title').textContent = isRegisterMode ? '회원가입' : '로그인';
  document.getElementById('login-btn').textContent = isRegisterMode ? '가입하기' : '로그인';
  document.querySelector('.register-hint').innerHTML = isRegisterMode
    ? '이미 계정이 있나요? <button class="link-btn" onclick="toggleRegister()">로그인</button>'
    : '처음이신가요? <button class="link-btn" onclick="toggleRegister()">회원가입</button>';
}

async function handleLogin() {
  const name = document.getElementById('login-name').value.trim();
  const phone = document.getElementById('login-phone').value.trim();
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  if (!name || phone.length !== 4 || !/^\d{4}$/.test(phone)) {
    errEl.textContent = '이름과 전화번호 뒷 4자리(숫자)를 입력해주세요.'; errEl.style.display = 'block'; return;
  }
  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner" style="border-color:rgba(255,255,255,0.3);border-top-color:white;"></span>';
  try {
    let user = null;
    if (name === SEED_ADMIN.name && phone === SEED_ADMIN.phoneLast4) {
      user = await ensureAdminSeed();
    } else {
      const found = await fsQuery('users', [['name', 'EQUAL', name], ['phoneLast4', 'EQUAL', phone]]);
      if (isRegisterMode) {
        if (found.length > 0) { errEl.textContent = '이미 등록된 계정입니다.'; errEl.style.display = 'block'; btn.disabled=false; btn.textContent='가입하기'; return; }
        const id = `${name}_${phone}_${Date.now()}`;
        await fsSet('users', id, { name, phoneLast4: phone, createdAt: new Date().toISOString(), isAdmin: false });
        user = { id, name, phoneLast4: phone, isAdmin: false };
      } else {
        if (found.length === 0) { errEl.textContent = '등록되지 않은 계정입니다. 회원가입해주세요.'; errEl.style.display = 'block'; btn.disabled=false; btn.textContent='로그인'; return; }
        user = found[0];
      }
    }
    currentUser = user;
    localStorage.setItem('addi_user', JSON.stringify(user));
    enterApp();
  } catch(e) {
    errEl.textContent = '네트워크 오류가 발생했습니다.'; errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = isRegisterMode ? '가입하기' : '로그인';
  }
}

function logout() {
  if (!confirm('로그아웃 하시겠습니까?')) return;
  localStorage.removeItem('addi_user');
  currentUser = null; todayAttendance = null;
  document.getElementById('main-app').style.display = 'none';
  document.getElementById('login-page').style.display = 'flex';
  document.getElementById('login-name').value = '';
  document.getElementById('login-phone').value = '';
}

function enterApp() {
  document.getElementById('login-page').style.display = 'none';
  document.getElementById('main-app').style.display = 'flex';
  document.getElementById('user-name-display').textContent = currentUser.name;
  document.getElementById('user-avatar').textContent = currentUser.name[0];
  document.getElementById('today-date').textContent = new Date().toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'long' });
  if (isAdmin(currentUser)) {
    document.getElementById('admin-badge').style.display = 'inline-flex';
    document.getElementById('nav-admin').style.display = 'flex';
  }
  loadTodayAttendance();
  loadRecentRecords();
}

async function loadTodayAttendance() {
  const recs = await fsQuery('attendance', [['userId', 'EQUAL', currentUser.id], ['date', 'EQUAL', getToday()]]);
  todayAttendance = recs.find(r => r.status === 'active' || r.status === 'completed') || null;
  renderStatus();
}

function renderStatus() {
  const badge = document.getElementById('status-badge');
  const ci = document.getElementById('checkin-btn'), co = document.getElementById('checkout-btn');
  const di = document.getElementById('duration-item');
  if (!todayAttendance) {
    badge.className='status-badge badge-none'; badge.textContent='미출근';
    document.getElementById('checkin-display').textContent='--:--';
    document.getElementById('checkout-display').textContent='--:--';
    ci.disabled=false; co.disabled=true; ci.textContent='출근하기'; di.style.display='none';
  } else if (todayAttendance.status === 'active') {
    badge.className='status-badge badge-in'; badge.textContent='근무중';
    document.getElementById('checkin-display').textContent=formatTime(todayAttendance.checkIn);
    document.getElementById('checkout-display').textContent='--:--';
    ci.disabled=true; co.disabled=false; ci.textContent='출근완료'; di.style.display='none';
  } else {
    badge.className='status-badge badge-out'; badge.textContent='퇴근완료';
    document.getElementById('checkin-display').textContent=formatTime(todayAttendance.checkIn);
    document.getElementById('checkout-display').textContent=formatTime(todayAttendance.checkOut);
    ci.disabled=true; co.disabled=true; ci.textContent='출근완료';
    const dur = calcDuration(todayAttendance.checkIn, todayAttendance.checkOut);
    if (dur) { di.style.display='flex'; document.getElementById('duration-display').textContent=dur; }
  }
}

async function handleCheckIn() {
  if (todayAttendance) return;
  const now = new Date().toISOString();
  document.getElementById('checkin-btn').disabled=true;
  document.getElementById('checkin-btn').innerHTML='<span class="spinner"></span>';
  const id = await fsAdd('attendance', { userId: currentUser.id, date: getToday(), checkIn: now, status: 'active' });
  if (id) {
    todayAttendance={id, userId:currentUser.id, date:getToday(), checkIn:now, status:'active'};
    renderStatus(); showToast('출근이 기록되었습니다 🟢'); loadRecentRecords();
  } else {
    showToast('오류가 발생했습니다');
    document.getElementById('checkin-btn').disabled=false; document.getElementById('checkin-btn').textContent='출근하기';
  }
}

async function handleCheckOut() {
  if (!todayAttendance || todayAttendance.status!=='active') return;
  const now = new Date().toISOString();
  document.getElementById('checkout-btn').disabled=true;
  document.getElementById('checkout-btn').innerHTML='<span class="spinner"></span>';
  const ok = await fsUpdate('attendance', todayAttendance.id, { checkOut: now, status: 'completed' });
  if (ok) {
    todayAttendance.checkOut=now; todayAttendance.status='completed';
    renderStatus(); showToast('퇴근이 기록되었습니다 👋'); loadRecentRecords();
  } else {
    showToast('오류가 발생했습니다');
    document.getElementById('checkout-btn').disabled=false; document.getElementById('checkout-btn').textContent='퇴근하기';
  }
}

async function loadRecentRecords() {
  const recs = await fsQuery('attendance', [['userId', 'EQUAL', currentUser.id]]);
  const list = document.getElementById('record-list');
  const sorted = recs.sort((a,b)=>(b.checkIn||'').localeCompare(a.checkIn||'')).slice(0,7);
  if (!sorted.length) { list.innerHTML='<div class="empty-state">기록이 없습니다</div>'; return; }
  list.innerHTML = sorted.map(r => `
    <div class="record-item">
      <div><div class="record-date">${formatDate(r.checkIn)}</div>
      <div class="record-times">출근 ${formatTime(r.checkIn)} · 퇴근 ${r.checkOut?formatTime(r.checkOut):'근무중'}</div></div>
      <div class="record-duration" style="${!r.checkOut?'background:var(--success-light);color:#059669;':''}">${r.checkOut?calcDuration(r.checkIn,r.checkOut):'근무중'}</div>
    </div>`).join('');
}

let adminTab = 'today';
function switchAdminTab(tab) {
  adminTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',['today','monthly','members'][i]===tab));
  ['admin-today','admin-monthly','admin-members'].forEach((id,i)=>{
    document.getElementById(id).style.display=['today','monthly','members'][i]===tab?'block':'none';
  });
  if (tab==='today') loadAdminToday();
  if (tab==='members') loadAdminMembers();
}

async function loadAdminToday() {
  const today = getToday();
  const [allUsers, todayRecs] = await Promise.all([fsQuery('users'), fsQuery('attendance', [['date','EQUAL',today]])]);
  document.getElementById('stat-total').textContent = allUsers.length;
  document.getElementById('stat-in').textContent = todayRecs.filter(r=>r.status==='active'||r.status==='completed').length;
  const ml = document.getElementById('member-list');
  if (!allUsers.length) { ml.innerHTML='<div class="empty-state">팀원이 없습니다</div>'; return; }
  ml.innerHTML = allUsers.map(u => {
    const rec = todayRecs.find(r=>r.userId===u.id);
    const [stText, stClass] = !rec ? ['미출근','badge-none'] : rec.status==='active' ? ['근무중','badge-in'] : ['퇴근완료','badge-out'];
    const times = rec ? `출근 ${formatTime(rec.checkIn)}${rec.checkOut?' · 퇴근 '+formatTime(rec.checkOut):''}` : '출근 기록 없음';
    return `<div class="member-row">
      <div class="member-avatar">${u.name[0]}</div>
      <div class="member-info">
        <div class="member-name">${u.name}${isAdmin(u)?' <span style="font-size:10px;color:var(--brand);">관리자</span>':''}</div>
        <div class="member-time">${times}</div>
      </div>
      <div class="member-status ${stClass}">${stText}</div>
    </div>`;
  }).join('');
}

async function loadAdminMembers() {
  const users = await fsQuery('users');
  const list = document.getElementById('admin-member-list');
  if (!users.length) { list.innerHTML='<div class="empty-state">팀원이 없습니다</div>'; return; }
  list.innerHTML = users.map(u => {
    const isSelf = u.id === currentUser.id;
    return `<div class="member-row" style="flex-direction:column;align-items:flex-start;gap:8px;">
      <div style="display:flex;align-items:center;gap:12px;width:100%;">
        <div class="member-avatar">${u.name[0]}</div>
        <div class="member-info">
          <div class="member-name">${u.name}${isSelf?' <span style="font-size:10px;color:var(--text-muted);">(나)</span>':''}</div>
          <div class="member-time">전화번호 끝 ****${u.phoneLast4}</div>
        </div>
      </div>
      <div class="admin-toggle-row">
        <span class="admin-toggle-label">관리자 권한 ${isAdmin(u)?'<span style="color:var(--brand);font-weight:600;">부여됨</span>':'미부여'}</span>
        <label class="toggle">
          <input type="checkbox" ${isAdmin(u)?'checked':''} ${isSelf?'disabled':''} onchange="toggleAdminRole('${u.id}', this.checked, this)" />
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>`;
  }).join('');
}

async function toggleAdminRole(userId, newVal, checkbox) {
  checkbox.disabled = true;
  const ok = await fsUpdate('users', userId, { isAdmin: newVal });
  if (ok) { showToast(newVal ? '관리자 권한이 부여되었습니다 ✅' : '관리자 권한이 해제되었습니다'); loadAdminMembers(); }
  else { showToast('변경에 실패했습니다'); checkbox.checked = !newVal; checkbox.disabled = false; }
}

function populateMonthSelect() {
  const sel = document.getElementById('month-select');
  if (sel.options.length > 0) return;
  const now = new Date();
  for (let i=0; i<6; i++) {
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const val = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const opt = document.createElement('option');
    opt.value=val; opt.textContent=`${d.getFullYear()}년 ${d.getMonth()+1}월`;
    if (i===0) opt.selected=true;
    sel.appendChild(opt);
  }
  loadMonthlyData();
}

async function loadMonthlyData() {
  const month = document.getElementById('month-select').value;
  const [y,m] = month.split('-');
  const start=`${y}-${m}-01`, end=`${y}-${m}-31`;
  const [allUsers, recs] = await Promise.all([fsQuery('users'), fsQuery('attendance')]);
  const filtered = recs.filter(r=>r.date>=start&&r.date<=end&&r.status==='completed');
  const grouped = {};
  for (const r of filtered) { if (!grouped[r.userId]) grouped[r.userId]=[]; grouped[r.userId].push(r); }
  const list = document.getElementById('monthly-list');
  list.innerHTML = allUsers.map(u => {
    const urecs = grouped[u.id]||[];
    if (!urecs.length) return `<div class="member-row"><div class="member-avatar">${u.name[0]}</div><div class="member-info"><div class="member-name">${u.name}</div><div class="member-time">기록 없음</div></div><div class="record-duration" style="background:#F3F4F6;color:#6B7280;">0일</div></div>`;
    const totalM = urecs.reduce((s,r)=>s+(r.checkOut?(new Date(r.checkOut)-new Date(r.checkIn))/60000:0),0);
    return `<div class="member-row" style="cursor:pointer;" onclick="showMemberDetail('${u.id}','${u.name}','${month}')">
      <div class="member-avatar">${u.name[0]}</div>
      <div class="member-info"><div class="member-name">${u.name}</div><div class="member-time">${urecs.length}일 출근 · 총 ${Math.floor(totalM/60)}h ${Math.floor(totalM%60)}m</div></div>
      <div class="record-duration">${urecs.length}일</div>
    </div>`;
  }).join('');
}

async function showMemberDetail(userId, name, month) {
  const [y,m] = month.split('-');
  const recs = await fsQuery('attendance', [['userId','EQUAL',userId]]);
  const filtered = recs.filter(r=>r.date.startsWith(`${y}-${m}`)&&r.status==='completed').sort((a,b)=>a.date.localeCompare(b.date));
  document.getElementById('modal-content').innerHTML = `
    <div style="font-size:17px;font-weight:700;margin-bottom:16px;">${name}님 · ${y}년 ${parseInt(m)}월 상세</div>
    <div class="record-list">${filtered.map(r=>`<div class="record-item">
      <div><div class="record-date">${formatDate(r.checkIn)}</div><div class="record-times">출근 ${formatTime(r.checkIn)} · 퇴근 ${formatTime(r.checkOut)}</div></div>
      <div class="record-duration">${calcDuration(r.checkIn,r.checkOut)}</div>
    </div>`).join('')}</div>`;
  document.getElementById('modal').classList.add('open');
}

function closeModal(e) { if (e.target===document.getElementById('modal')) document.getElementById('modal').classList.remove('open'); }

function switchPage(page) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(`page-${page}`).classList.add('active');
  document.getElementById(`nav-${page}`).classList.add('active');
  if (page==='admin') { loadAdminToday(); populateMonthSelect(); }
}

// Init
(async () => {
  const saved = localStorage.getItem('addi_user');
  if (saved) {
    try { currentUser = JSON.parse(saved); enterApp(); return; } catch(e) { localStorage.removeItem('addi_user'); }
  }
  document.getElementById('login-name').value = '배유진';
  document.getElementById('login-phone').value = '1734';
  const user = await ensureAdminSeed();
  currentUser = user;
  localStorage.setItem('addi_user', JSON.stringify(user));
  enterApp();
})();
</script>
